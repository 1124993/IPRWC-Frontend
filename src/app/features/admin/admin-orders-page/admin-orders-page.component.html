<section class="admin-orders">
    <header class="bar">
        <h2>Admin · Orders</h2>
        <div class="actions">
            <a mat-stroked-button routerLink="/admin/products">
                <mat-icon>inventory_2</mat-icon>
                Products
            </a>
        </div>
    </header>

    <div *ngIf="loading()" class="center">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Loading…</p>
    </div>

    <div *ngIf="!loading()" class="table-wrap">
        <table mat-table [dataSource]="rows()" class="mat-elevation-z1">

            <!-- ID -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>ID</th>
                <td mat-cell *matCellDef="let r">{{ r.id }}</td>
            </ng-container>

            <!-- Email -->
            <ng-container matColumnDef="userEmail">
                <th mat-header-cell *matHeaderCellDef>Customer</th>
                <td mat-cell *matCellDef="let r">{{ r.userEmail }}</td>
            </ng-container>

            <!-- Created -->
            <ng-container matColumnDef="createdAt">
                <th mat-header-cell *matHeaderCellDef>Created</th>
                <td mat-cell *matCellDef="let r">
                    {{ r.createdAt | date:'medium' }}
                </td>
            </ng-container>

            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="right">Actions</th>
                <td mat-cell *matCellDef="let r" class="right">
                    <button mat-icon-button matTooltip="View lines" (click)="viewLines(r)">
                        <mat-icon>receipt_long</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</section>
