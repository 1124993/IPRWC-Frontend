<h2 mat-dialog-title>Edit product</h2>

<div mat-dialog-content class="dialog-body">
    <form [formGroup]="form" (ngSubmit)="save()">
        <mat-form-field appearance="outline" class="full">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" />
            <mat-error *ngIf="form.controls.name.hasError('required')">Name is required</mat-error>
        </mat-form-field>

        <div class="grid2">
            <mat-form-field appearance="outline">
                <mat-label>Price (EUR)</mat-label>
                <input matInput type="number" step="0.01" formControlName="price" />
                <mat-error *ngIf="form.controls.price.hasError('required')">Price is required</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Stock</mat-label>
                <input matInput type="number" step="1" formControlName="stock" />
                <mat-error *ngIf="form.controls.stock.hasError('required')">Stock is required</mat-error>
            </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full">
            <mat-label>Category</mat-label>
            <mat-select formControlName="category">
                <mat-option *ngFor="let c of categories" [value]="c">{{ c }}</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
            <mat-label>Image URL</mat-label>
            <input matInput formControlName="imageUrl" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
            <mat-label>Description</mat-label>
            <textarea matInput rows="3" formControlName="description"></textarea>
        </mat-form-field>
    </form>
</div>

<div mat-dialog-actions align="end">
    <button mat-button (click)="cancel()" [disabled]="saving">Cancel</button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="saving || form.invalid">
        <mat-icon>save</mat-icon>
        Save
    </button>
</div>
