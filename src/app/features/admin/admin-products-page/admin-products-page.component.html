<section class="admin-products">
    <header class="bar">
        <h2>Admin · Products</h2>

        <div class="stats">
            <mat-chip-set>
                <mat-chip appearance="outlined" color="primary">Active: {{ activeCount() }}</mat-chip>
                <mat-chip appearance="outlined" color="warn">Archived: {{ archivedCount() }}</mat-chip>
            </mat-chip-set>
        </div>

        <div class="actions">
            <!-- create dialog next step -->
            <button mat-raised-button color="primary" (click)="createProduct()">
                <mat-icon>add</mat-icon> New Product
            </button>
            <a mat-stroked-button routerLink="/products">View Store</a>
        </div>
    </header>

    <div *ngIf="loading()" class="center">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Loading…</p>
    </div>

    <div *ngIf="!loading()" class="table-wrap">
        <table mat-table [dataSource]="rows()" class="mat-elevation-z1">

            <!-- Name -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Name</th>
                <td mat-cell *matCellDef="let r">
                    <div class="name-cell">
                        <img *ngIf="r.imageUrl" [src]="r.imageUrl" [alt]="r.name" />
                        <div>
                            <div class="title">{{ r.name }}</div>
                            <div class="desc" *ngIf="r.description">{{ r.description }}</div>
                        </div>
                    </div>
                </td>
            </ng-container>

            <!-- Price -->
            <ng-container matColumnDef="price">
                <th mat-header-cell *matHeaderCellDef>Price</th>
                <td mat-cell *matCellDef="let r">
                    {{ r.price | currency:'EUR':'symbol':'1.2-2' }}
                </td>
            </ng-container>

            <!-- Stock -->
            <ng-container matColumnDef="stock">
                <th mat-header-cell *matHeaderCellDef>Stock</th>
                <td mat-cell *matCellDef="let r">{{ r.stock }}</td>
            </ng-container>

            <!-- Category -->
            <ng-container matColumnDef="category">
                <th mat-header-cell *matHeaderCellDef>Category</th>
                <td mat-cell *matCellDef="let r">{{ r.category }}</td>
            </ng-container>

            <!-- Archived -->
            <ng-container matColumnDef="archived">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let r">
                    <mat-chip [color]="r.archived ? 'warn' : 'primary'" appearance="outlined">
                        {{ r.archived ? 'Archived' : 'Active' }}
                    </mat-chip>
                </td>
            </ng-container>

            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="right">Actions</th>
                <td mat-cell *matCellDef="let r" class="right">
                    <button mat-icon-button matTooltip="Edit" (click)="editProduct(r)">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button mat-icon-button [color]="r.archived ? 'primary' : 'warn'"
                        [matTooltip]="r.archived ? 'Unarchive' : 'Archive'" (click)="toggleArchive(r)">
                        <mat-icon>{{ r.archived ? 'unarchive' : 'archive' }}</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</section>
