<mat-card class="signup-card" appearance="outlined">
    <h2>Create account</h2>

    <form [formGroup]="form" novalidate>
        <mat-form-field appearance="outline" class="full">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" autocomplete="username" />
            <mat-error *ngIf="form.controls.email.hasError('required')">Email is required</mat-error>
            <mat-error *ngIf="form.controls.email.hasError('email')">Invalid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
            <mat-label>Password</mat-label>
            <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password"
                autocomplete="new-password" />
            <button mat-icon-button matSuffix type="button" (click)="hide.set(!hide())"
                aria-label="Toggle password visibility">
                <mat-icon>{{ hide() ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
            <mat-hint>6–100 characters</mat-hint>
            <mat-error *ngIf="form.controls.password.hasError('required')">Password is required</mat-error>
            <mat-error *ngIf="form.controls.password.hasError('minlength')">Minimum 6 characters</mat-error>
            <mat-error *ngIf="form.controls.password.hasError('maxlength')">Maximum 100 characters</mat-error>
        </mat-form-field>

        <button type="button" mat-raised-button color="primary" class="full" [disabled]="loading() || form.invalid"
            (click)="submit($event)">
            {{ loading() ? 'Creating account…' : 'Sign up' }}
        </button>

        <p *ngIf="errorMsg()" class="error">{{ errorMsg() }}</p>
    </form>

    <a routerLink="/login" style="margin-top:12px; display:inline-block;">Back to Login</a>
</mat-card>
