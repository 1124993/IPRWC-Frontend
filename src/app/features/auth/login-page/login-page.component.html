<mat-card class="login-card" appearance="outlined">
    <h2>Login</h2>

    <!-- Use a div to avoid native form submission -->
    <div [formGroup]="form" novalidate (keydown.enter)="submit($event)">
        <mat-form-field appearance="outline" class="full">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" autocomplete="username" />
            <mat-error *ngIf="form.controls.email.hasError('required')">Email is required</mat-error>
            <mat-error *ngIf="form.controls.email.hasError('email')">Invalid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
            <mat-label>Password</mat-label>
            <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password"
                autocomplete="current-password" />
            <button mat-icon-button matSuffix type="button" (click)="hide.set(!hide())"
                [attr.aria-label]="'Toggle password visibility'">
                <mat-icon>{{ hide() ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
            <mat-error *ngIf="form.controls.password.hasError('required')">Password is required</mat-error>
        </mat-form-field>

        <button type="button" mat-raised-button color="primary" class="full" [disabled]="loading() || form.invalid"
            (click)="$event.preventDefault(); $event.stopPropagation(); $event.stopImmediatePropagation(); submit($event)">
            {{ loading() ? 'Signing in…' : 'Sign in' }}
        </button>

        <p *ngIf="errorMsg()" class="error">{{ errorMsg() }}</p>
    </div>

    <a routerLink="/products" style="margin-top:12px; display:inline-block;">Back to products</a>
    <a routerLink="/signup" style="margin-top:12px; display:inline-block;">
        Create account
    </a>
</mat-card>
